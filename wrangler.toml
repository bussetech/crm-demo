# Cloudflare Workers config — Workers-class PROD per ADR-0023 §2 / the
# SaaS stratum (ADR-0048). No secrets in this file, ever: runtime secrets
# live in Workers secrets / Supabase config (provider-native stores,
# ADR-0023 §3). Values here are names and non-secret config only.
#
# PROD serves at crm-demo.bussetech.com as a Worker custom domain — never
# GitHub Pages (founding ADR-0055 §2). Wiring the hostname is the go-live
# provisioning act (CRMDEMO-EPIC1-07, the sysop's clock); no route is
# configured here until then.
name = "crm-demo"
# Two planes, one deployable: src/worker.ts routes /jobs/* + the cron to
# the job plane and delegates everything else to the app (src/index.tsx).
main = "src/worker.ts"
compatibility_date = "2026-07-01"
# supabase-js relies on Node builtins (Buffer); nodejs_compat is the
# supported Workers path for it (stratum gotcha).
compatibility_flags = ["nodejs_compat"]

# Runtime observability (ADR-0023 §1): Workers Logs capture structured
# console output.
[observability]
enabled = true

# The reset-to-baseline job runs in the APP PLANE (stratum law — never
# GitHub Actions). Cadence is GD-0035 (platform#429, recommendation
# accepted): nightly 04:00 ET + on-demand dispatch + demo-freeze switch.
# Workers cron is UTC, so 08:00 UTC = 04:00 EDT; in winter it fires at
# 03:00 EST — an hour early against synthetic data, stated rather than
# solved (a DST-tracking cron would need two triggers and a guard for no
# demo gain). The trigger registers at deploy time (07's provisioning act);
# until then nothing schedules anything, and the handler itself no-ops
# loudly without SUPABASE_SERVICE_ROLE_KEY (a Workers secret, 07).
[triggers]
crons = ["0 8 * * *"]

# Non-secret vars. SUPABASE_URL is per-environment; the anon key is public
# by design (RLS is the boundary); the service-role key is a Workers
# *secret* (wrangler secret put SUPABASE_SERVICE_ROLE_KEY) — never here.
[vars]
SUPABASE_URL = ""
SUPABASE_ANON_KEY = ""
APP_BUILD_ID = "dev"
