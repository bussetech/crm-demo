# deploy — deliberate deploys only (workflow_dispatch), each journaled to
# the `deploys` data branch with the shipped build id; /healthz returns
# the same id, closing the receipt loop (ADR-0048 §3). PROD is
# Workers-class — never GitHub Pages (founding ADR-0055 §2). Secrets: the
# repo-scoped deploy credential is the ONE GitHub-side exception
# (ADR-0023 §3); runtime secrets live in provider-native stores.
#
# DELIBERATELY UNDEPLOYABLE TODAY: the gate includes the isolation proof,
# which does not exist yet — so a dispatch fails before wrangler runs.
# That is the stratum law working (nothing ships, deploys, or demos until
# the proof is green), not a bug. The proof lands with the first schema
# sessions; the deploy credential is a go-live provisioning act.
name: deploy

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type "deploy" to confirm a production deploy'
        required: true

permissions:
  contents: write # deploys-branch receipt journal

concurrency:
  group: deploy-prod
  cancel-in-progress: false

jobs:
  deploy:
    if: ${{ github.repository_owner == 'bussetech' && inputs.confirm == 'deploy' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v4.2.2
      - uses: actions/setup-node@1d0ff469b7ec7b3cb9d8673fde0c81c44821de2a # v4.2.0
        with:
          node-version: 24
          cache: npm
      - uses: supabase/setup-cli@46f7f98c7f948ad727d22c1e67fab04c223a0520 # v3.0.0
        with:
          version: latest
      - run: npm ci
      # The full gate runs before anything ships — the isolation proof is
      # non-waivable (stratum law; founding ADR-0055 §3: security NFRs are
      # never demo-grade).
      - run: npm run typecheck
      - run: npm test
      - run: supabase start
      - name: THE ISOLATION PROOF (launch blocker)
        run: npm run test:isolation
      - if: always()
        run: supabase stop
      - name: deploy to Workers
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN_CRM_DEMO }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID_CRM_DEMO }}
        run: |
          BUILD_ID="${GITHUB_SHA::12}-r${GITHUB_RUN_NUMBER}"
          npx wrangler deploy --var APP_BUILD_ID:"$BUILD_ID"
          echo "BUILD_ID=$BUILD_ID" >> "$GITHUB_ENV"
      - name: journal the deploy receipt
        run: |
          git config user.name "crm-demo deploy"
          git config user.email "noreply@bussetech.com"
          git fetch origin deploys:deploys 2>/dev/null || git branch deploys
          git checkout deploys
          mkdir -p deploys
          printf '{"ts":"%s","sha":"%s","build_id":"%s","actor":"%s","run_id":"%s"}\n' \
            "$(date -u +%Y-%m-%dT%H:%M:%SZ)" "$GITHUB_SHA" "$BUILD_ID" \
            "$GITHUB_ACTOR" "$GITHUB_RUN_ID" >> "deploys/$(date -u +%Y-%m).jsonl"
          git add deploys && git commit -m "deploy receipt: $BUILD_ID"
          git push origin deploys
