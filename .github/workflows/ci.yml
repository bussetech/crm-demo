# ci — the PROJECT-OWNED jobs (typecheck, unit tests). The studio app-CI
# shell rides its own workflow (app-shell.yml) so an unresolvable reusable
# reference can never hold these jobs hostage (the eaap lesson).
#
# The isolation-proof job runs THE PROOF against a real local Supabase
# stack on the runner (the stratum's launch-blocker bar since EPIC5-02):
# migrate → seed the scenario baseline → prove isolation. It gates every
# push and PR, not just deploys.
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v4.2.2
      - uses: actions/setup-node@1d0ff469b7ec7b3cb9d8673fde0c81c44821de2a # v4.2.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  isolation-proof:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v4.2.2
      - uses: actions/setup-node@1d0ff469b7ec7b3cb9d8673fde0c81c44821de2a # v4.2.0
        with:
          node-version: 24
          cache: npm
      - uses: supabase/setup-cli@46f7f98c7f948ad727d22c1e67fab04c223a0520 # v3.0.0
        with:
          version: latest
      - run: npm ci
      - run: supabase start
      - run: npm run seed
      - name: THE ISOLATION PROOF (launch blocker)
        run: npm run test:isolation
      - if: always()
        run: supabase stop
