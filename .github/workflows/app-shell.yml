# app-shell — the studio app-CI shell for saas repos (ADR-0023 §1 /
# ADR-0048): secret scan + Actions pin lint + deploy-workflow lint, no
# app logic. Pin @v1, never @main. Kept in its OWN file (the eaap
# lesson): a reusable workflow that fails to resolve fails the whole
# workflow file — the project's own CI (ci.yml) must never be hostage
# to it.
name: app-shell

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  app-shell:
    if: ${{ github.repository_owner == 'bussetech' }}
    uses: bussetech/ci/.github/workflows/reusable-app-ci.yml@v1
